<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f331d" />
      <stop offset="50%" stop-color="#1b4d2e" />
      <stop offset="100%" stop-color="#0d2616" />
    </linearGradient>

    <!-- Main Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Golden Sun & Sprout Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Rounded Tile -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" filter="url(#glow)"/>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2"/>

  <!-- Golden Morning Sun Arc -->
  <circle cx="68" cy="32" r="12" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="68" cy="32" r="16" fill="none" stroke="rgba(253, 224, 71, 0.35)" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Primary Organic Sprout Leaf (Right) -->
  <path d="M50 78 C50 56 64 36 82 34 C82 58 68 76 50 78 Z" fill="url(#leafGrad)" />

  <!-- Secondary Organic Seedling Leaf (Left) -->
  <path d="M50 78 C50 62 38 46 22 46 C22 64 34 76 50 78 Z" fill="url(#goldGrad)" opacity="0.92" />

  <!-- Central Stem & Living Sprout Center -->
  <path d="M50 82 L50 26 C50 20 54 18 56 16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Subtle Leaf Vein Accent -->
  <path d="M50 58 Q62 52 70 46" fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M50 66 Q38 60 32 54" fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
